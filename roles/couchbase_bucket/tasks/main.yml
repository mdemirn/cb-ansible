---
- name: Display start message
  ansible.builtin.debug:
    msg:
      - "  COUCHBASE BUCKET CREATION"
      - "Bucket Name: {{ bucket_name }}"
      - "Method: {{ 'REST API' if use_rest_api | bool else 'CLI' }}"
      - "TLS: {{ 'Enabled' if use_tls | bool else 'Disabled' }}"
  tags:
    - always
    - info

- name: Validate TLS configuration
  ansible.builtin.assert:
    that:
      - not (tls_client_cert_path | length > 0) or (tls_client_key_path | length > 0)
      - not (tls_client_key_path | length > 0) or (tls_client_cert_path | length > 0)
    fail_msg: "TLS client certificate and key must be specified together."
    success_msg: "TLS configuration is valid."
  when: use_tls | bool
  tags:
    - validate
    - tls

- name: Health check
  ansible.builtin.include_tasks: health_check.yml
  tags:
    - health_check

- name: Display selected host
  ansible.builtin.debug:
    msg: "Using Couchbase host: {{ couchbase_host }}:{{ couchbase_port }}"
  tags:
    - always
    - info

- name: Validate
  ansible.builtin.include_tasks: validate.yml
  tags:
    - validate

- name: Create bucket
  ansible.builtin.include_tasks: create.yml
  tags:
    - create

- name: Get bucket info
  ansible.builtin.include_tasks: info.yml
  tags:
    - info
